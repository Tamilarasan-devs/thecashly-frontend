<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Gradient: Deep Royal Indigo / Midnight Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Indigo to Cyan Accent for the Monogram 'C' -->
    <linearGradient id="cArcGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="80%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <!-- Upward Growth Arrow Gradient (Vibrant Cyan / Electric Neon) -->
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Inner Core Sheen Gradient -->
    <linearGradient id="sheenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Drop Glow Filter for Modern Fintech Neon Look -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%" filterUnits="userSpaceOnUse">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle / Rounded Badge Background -->
  <rect x="4" y="4" width="92" height="92" rx="26" fill="url(#bgGrad)" filter="url(#subtleShadow)" />
  <rect x="4.5" y="4.5" width="91" height="91" rx="25.5" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.35" />

  <!-- Outer Ambient Ring Segment -->
  <circle cx="50" cy="50" r="38" stroke="url(#cArcGrad)" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.3" />

  <g filter="url(#neonGlow)">
    <!-- Geometric 'C' Monogram: Smooth thick curved sweep opening to the right -->
    <!-- Arc from top-right down around left to bottom-right -->
    <path 
      d="M 64 34
         C 58 24, 46 22, 36 26
         C 23 31, 19 46, 22 60
         C 25 73, 38 80, 52 79
         C 61 78, 68 73, 71 66
         C 72.5 63, 70.5 59.5, 67 59.5
         C 64.5 59.5, 62.5 61, 60.5 63.5
         C 54.5 70, 41 68, 34 60
         C 28 53, 30 40, 39 34
         C 45 30, 54 30, 60 34
         C 62.5 35.8, 65.5 35, 66.8 32.5
         C 67.5 31, 66.5 29, 64 34 Z" 
      fill="url(#cArcGrad)"
    />

    <!-- Growth Trend Arrow launching upward-right through the 'C' -->
    <!-- Dynamic diagonal bar -->
    <path 
      d="M 40 60
         L 67 33"
      stroke="url(#arrowGrad)" 
      stroke-width="5" 
      stroke-linecap="round"
    />

    <!-- Arrow Head pointing to top-right (Growth) -->
    <path 
      d="M 53 31 
         H 71 
         C 72.1 31, 73 31.9, 73 33 
         V 51 
         L 66 44 
         L 66 38 
         L 60 38 
         Z" 
      fill="url(#arrowGrad)"
    />

    <!-- Dot Sparkle Accent at arrowhead tip -->
    <circle cx="73" cy="31" r="3" fill="#FFFFFF" opacity="0.95" />
    <circle cx="73" cy="31" r="5" stroke="#38BDF8" stroke-width="1" opacity="0.6" />
  </g>
</svg>
